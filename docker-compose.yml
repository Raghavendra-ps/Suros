services:
  backend:
    build: ./backend
    image: suros-backend:latest
    container_name: Suros-Backend
    ports:
      - "7689:8000"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - /:/mnt/host:ro
    restart: always
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - Suros-Network

  frontend:
    build: ./frontend
    image: suros-frontend:latest
    container_name: Suros-frontend
    ports:
      - "8755:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/static:/usr/share/nginx/html/static:ro
    restart: always
    networks:
      - Suros-Network

networks:
  Suros-Network:
    name: Suros-Network
