services:
  backend:
    build: ./backend
    container_name: server-monitor-backend
    ports:
      - "7689:8000"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - /:/mnt/host:ro
    restart: always
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  frontend:
    build: ./frontend
    container_name: server-monitor-frontend
    ports:
      - "8755:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/static:/usr/share/nginx/html/static:ro
    restart: always
