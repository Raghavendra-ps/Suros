services:
  backend:
    build: ./backend
    image: suros-backend:latest
    container_name: Suros-Backend
    ports:
      - "7689:8000"
    environment:
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
    volumes:
      - ./backend:/app
      - suros-data:/app/data
      - suros-logs:/app/logs
      - suros-static:/app/static
      - /dev:/dev
      - /:/mnt/host:ro
    restart: always
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - Suros-Network

  frontend:
    build: ./frontend
    image: suros-frontend:latest
    container_name: Suros-frontend
    ports:
      - "8755:80"
    depends_on:
      - backend
    volumes:
      - suros-static:/usr/share/nginx/html/static:ro
    restart: always
    networks:
      - Suros-Network

volumes:
  suros-data:
    name: suros-data
  suros-logs:
    name: suros-logs
  suros-static:
    name: suros-static

networks:
  Suros-Network:
    name: Suros-Network
